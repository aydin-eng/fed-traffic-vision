# Canonical 4-class schema and multi-source mappings for Cross-Domain Traffic Detection & FL
nc: 4
names:
  0: car
  1: motorcycle
  2: bus
  3: truck

sources:
  ua_detrac:
    domain_role: "Client 1 - East Asia CCTV (4 weather conditions)"
    class_map:
      car: 0
      van: 0
      bus: 2
      others: 3

  mio_tcd:
    domain_role: "Client 2 - North America Highway/Intersection CCTV"
    class_map:
      car: 0
      work_van: 0
      pickup_truck: 0
      motorcycle: 1
      bus: 2
      single_unit_truck: 3
      articulated_truck: 3
    ignored_labels:
      - pedestrian
      - bicycle
      - non-motorized_vehicle
      - motorized_vehicle

  coco2017:
    domain_role: "Client 3 - General Street / Multi-Angle Traffic"
    category_id_map:
      3: 0   # car -> car
      4: 1   # motorcycle -> motorcycle
      6: 2   # bus -> bus
      8: 3   # truck -> truck
